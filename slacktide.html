<script>
const url = "https://tides.gc.ca/en/stations/00066/predictions/annual";
const proxy = "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(url);

fetch(proxy)
  .then(res => res.text())
  .then(html => {

    const now = new Date();
    const rows = html.match(/<tr[^>]*>(.*?)<\/tr>/gs);

    let nextEvent = null;

    for (let row of rows) {

      if (!row.includes("HW") && !row.includes("LW")) continue;

      // ✅ extract all table cells
      const cells = [...row.matchAll(/<td[^>]*>(.*?)<\/td>/g)].map(x => x[1].trim());

      if (cells.length < 2) continue;

      // Example structure: [date, time, height, type]
      let time = null;
      let type = "";

      for (let c of cells) {
        if (/^\d{2}:\d{2}$/.test(c)) time = c;
        if (c === "HW" || c === "LW") type = c;
      }

      if (!time || !type) continue;

      // ✅ Extract month/day from row text (page includes it once per group)
      const dateMatch = row.match(/(\w+)\s+(\d{1,2})/);
      if (!dateMatch) continue;

      const month = dateMatch[1];
      const day = dateMatch[2];

      const year = new Date().getFullYear();
      const eventDate = new Date(`${month} ${day} ${year} ${time}`);

      if (eventDate > now) {
        nextEvent = {
          date: eventDate,
          type: type === "HW"
            ? "Ebb slack (after high water)"
            : "Flood slack (after low water)"
        };
        break;
      }
    }

    const container = document.getElementById("tide");

    if (!nextEvent) {
      container.innerHTML = "No upcoming tide data";
      return;
    }

    // ✅ Apply slack offset (~30 min)
    nextEvent.date.setMinutes(nextEvent.date.getMinutes() + 30);

    const formatted = nextEvent.date.toLocaleString('en-CA', {
      weekday: 'short',
      month: 'short',
      day: 'numeric',
      hour: 'numeric',
      minute: '2-digit',
      hour12: true
    });

    container.innerHTML = `
      <div><strong>${formatted}</strong></div>
      <div style="font-size:13px; color:#555;">${nextEvent.type}</div>
    `;
  })
  .catch(() => {
    document.getElementById("tide").innerHTML = "Unable to load tide data";
  });
</script>
